<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cash Pot</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  min-height: 100vh;
}

.header {
  padding: 22px 20px;
  text-align: center;
  border-bottom: 1px solid #202633;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 2px;
}

.subtitle {
  color: #8992a3;
  margin-top: 5px;
  font-size: 13px;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 25px 18px;
}

.balance-card {
  background: linear-gradient(135deg, #171d29, #10151f);
  border: 1px solid #293242;
  border-radius: 18px;
  padding: 22px;
  text-align: center;
  margin-bottom: 20px;
}

.balance-label {
  color: #8f99aa;
  font-size: 13px;
}

.balance {
  font-size: 34px;
  font-weight: bold;
  margin-top: 8px;
}

.game-card,
.history-card {
  background: #111722;
  border: 1px solid #293242;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.game-title,
.history-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 18px;
}

.slots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.slot {
  width: 75px;
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080b12;
  border: 2px solid #30394a;
  border-radius: 15px;
  font-size: 38px;
  overflow: hidden;
}

.slot.spinning {
  animation: reelSpin 0.12s linear infinite;
}

@keyframes reelSpin {

  0% {
    transform: translateY(-14px) rotateX(0deg);
  }

  50% {
    transform: translateY(14px) rotateX(180deg);
  }

  100% {
    transform: translateY(-14px) rotateX(360deg);
  }

}

.bet-section {
  margin-top: 20px;
  text-align: left;
}

.bet-section label {
  color: #9ca6b7;
  font-size: 13px;
}

.bet-input {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  background: #080b12;
  border: 1px solid #30394a;
  border-radius: 10px;
  color: white;
  font-size: 16px;
}

.quick-bets {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.quick-bet {
  flex: 1;
  padding: 10px 5px;
  border: 1px solid #30394a;
  border-radius: 9px;
  background: #171d29;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.quick-bet:active {
  transform: scale(0.96);
}

.payout-info {
  margin-top: 18px;
  padding: 13px;
  background: #080b12;
  border-radius: 10px;
  text-align: left;
  color: #8992a3;
  font-size: 13px;
  line-height: 1.7;
}

.payout-info strong {
  color: white;
}

.play-button {
  width: 100%;
  margin-top: 20px;
  padding: 17px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: white;
  color: #080b12;
}

.play-button:active {
  transform: scale(0.97);
}

.play-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.reset-button,
.clear-history {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: 1px solid #30394a;
  border-radius: 10px;
  background: transparent;
  color: #8992a3;
  cursor: pointer;
}

.result {
  min-height: 28px;
  margin-top: 18px;
  font-size: 17px;
  font-weight: bold;
}

.history-list {
  text-align: left;
  max-height: 300px;
  overflow-y: auto;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #252d3a;
  gap: 10px;
}

.history-item:last-child {
  border-bottom: none;
}

.history-game {
  color: #c8ced9;
  font-size: 14px;
}

.history-time {
  color: #697386;
  font-size: 11px;
  margin-top: 4px;
}

.win {
  color: #7ee787;
  font-weight: bold;
  white-space: nowrap;
}

.loss {
  color: #ff7b72;
  font-weight: bold;
  white-space: nowrap;
}

.empty-history {
  color: #697386;
  font-size: 14px;
  padding: 15px 0;
}

.footer {
  text-align: center;
  color: #596273;
  font-size: 12px;
  padding: 25px;
}

</style>
</head>

<body>

<header class="header">

  <div class="logo">
    🎰 CASH POT
  </div>

  <div class="subtitle">
    PLAY • SPIN • WIN
  </div>

</header>


<main class="container">


<section class="balance-card">

  <div class="balance-label">
    YOUR BALANCE
  </div>

  <div class="balance" id="balance">
    10,000 🪙
  </div>

</section>



<section class="game-card">

  <div class="game-title">
    🎰 Lucky Spin
  </div>


  <div class="slots">

    <div class="slot" id="slot1">
      🍒
    </div>

    <div class="slot" id="slot2">
      ⭐
    </div>

    <div class="slot" id="slot3">
      💎
    </div>

  </div>


  <div class="bet-section">

    <label>
      BET AMOUNT
    </label>

    <input
      id="bet"
      class="bet-input"
      type="number"
      value="500"
      min="100"
      step="100"
    >


    <div class="quick-bets">

      <button
        class="quick-bet"
        onclick="setBet(100)"
      >
        100
      </button>

      <button
        class="quick-bet"
        onclick="setBet(500)"
      >
        500
      </button>

      <button
        class="quick-bet"
        onclick="setBet(1000)"
      >
        1,000
      </button>

    </div>

  </div>


  <div class="payout-info">

    <strong>🏆 PAYOUTS</strong><br>

    3 matching symbols → <strong>5× bet</strong><br>

    2 matching symbols → <strong>2× bet</strong><br>

    No match → <strong>Lose bet</strong>

  </div>


  <button
    class="play-button"
    onclick="playGame()"
  >
    PLAY
  </button>


  <button
    class="reset-button"
    onclick="resetBalance()"
  >
    RESET BALANCE
  </button>


  <div
    class="result"
    id="result"
  >
    Good luck! 🍀
  </div>

</section>



<section class="history-card">

  <div class="history-title">
    📜 Game History
  </div>


  <div
    class="history-list"
    id="historyList"
  >

    <div class="empty-history">
      No games played yet.
    </div>

  </div>


  <button
    class="clear-history"
    onclick="clearHistory()"
  >
    CLEAR HISTORY
  </button>

</section>

</main>



<footer class="footer">

  Cash Pot • Virtual Coins Prototype

</footer>



<script>


/* =========================
   BALANCE
========================= */

let savedBalance =
  localStorage.getItem("cashPotBalance");

let balance =
  savedBalance !== null
    ? Number(savedBalance)
    : 10000;


/* =========================
   HISTORY
========================= */

let savedHistory =
  localStorage.getItem("cashPotHistory");

let gameHistory =
  savedHistory !== null
    ? JSON.parse(savedHistory)
    : [];


/* =========================
   GAME VARIABLES
========================= */

let spinning = false;

const symbols = [
  "🍒",
  "⭐",
  "💎",
  "🍋",
  "7️⃣"
];


updateBalance();

displayHistory();



/* =========================
   UPDATE BALANCE
========================= */

function updateBalance() {

  document.getElementById("balance").innerText =
    balance.toLocaleString() + " 🪙";

}



/* =========================
   SAVE BALANCE
========================= */

function saveBalance() {

  localStorage.setItem(
    "cashPotBalance",
    balance
  );

}



/* =========================
   SET QUICK BET
========================= */

function setBet(amount) {

  document.getElementById("bet").value =
    amount;

}



/* =========================
   PLAY GAME
========================= */

function playGame() {

  if (spinning) {
    return;
  }


  const bet =
    Number(
      document.getElementById("bet").value
    );


  const result =
    document.getElementById("result");


  const button =
    document.querySelector(".play-button");


  const slot1 =
    document.getElementById("slot1");


  const slot2 =
    document.getElementById("slot2");


  const slot3 =
    document.getElementById("slot3");


  /* CHECK BET */

  if (
    !Number.isFinite(bet) ||
    bet < 100
  ) {

    result.innerText =
      "Minimum bet is 100 coins.";

    return;

  }


  /* ONLY ALLOW WHOLE HUNDREDS */

  if (bet % 100 !== 0) {

    result.innerText =
      "Bet must be in multiples of 100.";

    return;

  }


  /* CHECK BALANCE */

  if (bet > balance) {

    result.innerText =
      "Insufficient coins.";

    return;

  }


  /* DEDUCT BET BEFORE SPIN */

  balance -= bet;

  saveBalance();

  updateBalance();


  /* START SPIN */

  spinning = true;

  button.disabled = true;

  button.innerText =
    "SPINNING...";

  result.innerText =
    "🎰 Spinning...";


  slot1.classList.add("spinning");

  slot2.classList.add("spinning");

  slot3.classList.add("spinning");


  let spins = 0;


  const animation =
    setInterval(function() {


      slot1.innerText =
        symbols[
          Math.floor(
            Math.random() * symbols.length
          )
        ];


      slot2.innerText =
        symbols[
          Math.floor(
            Math.random() * symbols.length
          )
        ];


      slot3.innerText =
        symbols[
          Math.floor(
            Math.random() * symbols.length
          )
        ];


      spins++;


      if (spins >= 25) {

        clearInterval(animation);

        finishGame(bet);

      }


    }, 100);

}



/* =========================
   FINISH GAME
========================= */

function finishGame(bet) {

  const slot1 =
    document.getElementById("slot1");

  const slot2 =
    document.getElementById("slot2");

  const slot3 =
    document.getElementById("slot3");


  const result =
    document.getElementById("result");


  const button =
    document.querySelector(".play-button");


  /* FINAL SYMBOLS */

  const a =
    symbols[
      Math.floor(
        Math.random() * symbols.length
      )
    ];


  const b =
    symbols[
      Math.floor(
        Math.random() * symbols.length
      )
    ];


  const c =
    symbols[
      Math.floor(
        Math.random() * symbols.length
      )
    ];


  slot1.innerText = a;

  slot2.innerText = b;

  slot3.innerText = c;


  /* STOP ANIMATION */

  slot1.classList.remove("spinning");

  slot2.classList.remove("spinning");

  slot3.classList.remove("spinning");


  let historyType;

  let historyAmount;

  let resultText;


  /* =========================
     JACKPOT
  ========================= */

  if (
    a === b &&
    b === c
  ) {

    const winnings =
      bet * 5;


    balance += winnings;


    historyAmount =
      winnings;


    historyType =
      "JACKPOT";


    resultText =
      "🎉 JACKPOT! +" +
      winnings +
      " coins!";

  }


  /* =========================
     TWO MATCH
  ========================= */

  else if (
    a === b ||
    b === c ||
    a === c
  ) {

    const winnings =
      bet * 2;


    balance += winnings;


    historyAmount =
      winnings;


    historyType =
      "TWO MATCH";


    resultText =
      "✨ TWO MATCH! +" +
      winnings +
      " coins!";

  }


  /* =========================
     LOSS
  ========================= */

  else {

    historyAmount =
      bet;


    historyType =
      "LOSS";


    resultText =
      "😢 You lost " +
      bet +
      " coins.";

  }


  /* SHOW RESULT */

  result.innerText =
    resultText;


  /* SAVE */

  saveBalance();

  updateBalance();


  /* HISTORY */

  addHistory(
    historyType,
    historyAmount,
    a + " " + b + " " + c
  );


  /* ENABLE */

  button.disabled = false;

  button.innerText =
    "PLAY";

  spinning = false;

}



/* =========================
   ADD HISTORY
========================= */

function addHistory(
  type,
  amount,
  symbolsResult
) {

  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  const historyItem = {

    type: type,

    amount: amount,

    symbols: symbolsResult,

    time: time

  };


  gameHistory.unshift(
    historyItem
  );


  gameHistory =
    gameHistory.slice(0, 10);


  localStorage.setItem(
    "cashPotHistory",
    JSON.stringify(gameHistory)
  );


  displayHistory();

}



/* =========================
   DISPLAY HISTORY
========================= */

function displayHistory() {

  const list =
    document.getElementById(
      "historyList"
    );


  if (
    gameHistory.length === 0
  ) {

    list.innerHTML =
      '<div class="empty-history">' +
      'No games played yet.' +
      '</div>';

    return;

  }


  list.innerHTML = "";


  gameHistory.forEach(
    function(item) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "history-item";


      const details =
        document.createElement(
          "div"
        );


      const game =
        document.createElement(
          "div"
        );


      game.className =
        "history-game";


      game.innerText =
        item.symbols +
        " • " +
        item.type;


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "history-time";


      time.innerText =
        item.time;


      details.appendChild(game);

      details.appendChild(time);


      const amount =
        document.createElement(
          "div"
        );


      if (
        item.type === "LOSS"
      ) {

        amount.className =
          "loss";


        amount.innerText =
          "-" +
          item.amount.toLocaleString() +
          " 🪙";

      }

      else {

        amount.className =
          "win";


        amount.innerText =
          "+" +
          item.amount.toLocaleString() +
          " 🪙";

      }


      row.appendChild(details);

      row.appendChild(amount);


      list.appendChild(row);

    }
  );

}



/* =========================
   CLEAR HISTORY
========================= */

function clearHistory() {

  gameHistory = [];


  localStorage.removeItem(
    "cashPotHistory"
  );


  displayHistory();


  document.getElementById(
    "result"
  ).innerText =
    "Game history cleared.";

}



/* =========================
   RESET BALANCE
========================= */

function resetBalance() {

  balance = 10000;


  saveBalance();


  updateBalance();


  document.getElementById(
    "result"
  ).innerText =
    "Balance reset to 10,000 coins.";

}

</script>

</body>
</html>
