<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cash Pot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #111;
      color: white;
    }

    h1 {
      font-size: 40px;
    }

    #balance {
      font-size: 24px;
      margin: 25px;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <h1>🎰 CASH POT</h1>

  <p>Play • Spin • Win</p>

  <div id="balance">Balance: 10,000 Coins</div>

  <button onclick="playGame()">PLAY</button>

  <div id="result">Press PLAY to start!</div>

  <script>
    let balance = 10000;

    function playGame() {

      let win = Math.random() < 0.5;

      if (win) {
        balance += 1000;
        document.getElementById("result").innerHTML =
          "🎉 YOU WON 1,000 COINS!";
      } else {
        balance -= 500;
        document.getElementById("result").innerHTML =
          "😢 YOU LOST 500 COINS";
      }

      document.getElementById("balance").innerHTML =
        "Balance: " + balance.toLocaleString() + " Coins";
    }
  </script>

</body>
</html>
